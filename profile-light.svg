<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610">
<defs>
  <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0891B2">
      <animate attributeName="stop-color" values="#0891B2;#6D28D9;#0284C7;#0891B2" dur="9s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#6D28D9">
      <animate attributeName="stop-color" values="#6D28D9;#0284C7;#0891B2;#6D28D9" dur="9s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7C3AED"/>
    <stop offset="50%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#10B981"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="30%" cy="20%" r="80%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#EEF2FF"/>
  </radialGradient>
  <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#0891B2" stop-opacity="0"/>
  <stop offset="45%" stop-color="#0891B2" stop-opacity="0.05"/>
  <stop offset="50%" stop-color="#67E8F9" stop-opacity="0.45"/>
  <stop offset="55%" stop-color="#0891B2" stop-opacity="0.05"/>
  <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
</linearGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#0F172A" opacity="0.04"/>
</pattern>
  <mask id="revealMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1180" height="620">
  <rect x="0" y="0" width="1180" height="0" fill="#fff">
    <animate attributeName="height" from="0" to="560" dur="2.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
</mask>
  <clipPath id="lc0"><rect x="500" y="42" width="0" height="26"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="0.75s" fill="freeze"/></rect></clipPath><clipPath id="lc1"><rect x="500" y="72" width="0" height="26"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="0.91s" fill="freeze"/></rect></clipPath><clipPath id="lc2"><rect x="500" y="102" width="0" height="26"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="1.07s" fill="freeze"/></rect></clipPath><clipPath id="lc3"><rect x="500" y="132" width="0" height="26"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="1.23s" fill="freeze"/></rect></clipPath><clipPath id="lc4"><rect x="500" y="162" width="0" height="26"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="1.39s" fill="freeze"/></rect></clipPath><clipPath id="lc5"><rect x="500" y="192" width="0" height="26"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="1.55s" fill="freeze"/></rect></clipPath>
  <style>
    .ascii  { font-family: 'Courier New', Consolas, monospace; font-size: 7.4px; fill: url(#asciiGrad); letter-spacing: -0.2px; }
    .key    { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #0E7490; font-weight: bold; }
    .value  { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #1E293B; }
    .cc     { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #94A3B8; }
    .head   { font-family: 'Courier New', Consolas, monospace; font-size: 17px; fill: #6D28D9; font-weight: bold; }
    .accent { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #059669; font-weight: bold; }
    text, tspan { white-space: pre; }

    .scan-label { font-family: 'Courier New', Consolas, monospace; font-size: 10px; fill: #DC2626; letter-spacing: 1px; }
    .panel-title { font-family: 'Courier New', Consolas, monospace; font-size: 11px; fill: #0369A1; letter-spacing: 2px; opacity: 0.7; }
    .cursor-blink { fill: #0E7490; }

  </style>
</defs>

<rect width="1180" height="610" rx="18" fill="url(#bgGlow)"/>
<rect width="1180" height="610" rx="18" fill="url(#scanlines)"/>

<g id="titlebar">
  <rect x="3" y="3" width="1174" height="34" rx="16" fill="#E2E8F0" fill-opacity="0.85"/>
  <circle cx="24" cy="20" r="5" fill="#EF4444"><animate attributeName="opacity" values="1;0.55;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="42" cy="20" r="5" fill="#F59E0B"><animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="20" r="5" fill="#10B981"><animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="1122" cy="20" r="4" fill="#F87171">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <text x="1132" y="24" class="scan-label">SCANNING</text>
</g>

<g transform="translate(0,38)">
  <rect x="14" y="26" width="488" height="468" rx="14" fill="#F1F5F9" fill-opacity="0.35" stroke="url(#borderGrad)" stroke-width="1" opacity="0.35"/>
  <rect x="508" y="10" width="655" height="500" rx="14" fill="#F1F5F9" fill-opacity="0.35" stroke="url(#borderGrad)" stroke-width="1" opacity="0.35"/>
  <text x="30" y="24" class="panel-title">VISUAL.MAP</text>
  <text x="524" y="24" class="panel-title">SYSTEM.INFO</text>

